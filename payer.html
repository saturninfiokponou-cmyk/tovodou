<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paiement TOVODOU</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px;text-align:center}.card{background:#222;padding:25px;border-radius:15px;max-width:400px;margin:auto;border:2px solid #ff8c00}input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}button{background:#ff8c00;color:#000;padding:15px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;margin-top:10px}#prix{font-size:28px;color:#ff8c00;font-weight:bold}.valid{color:#00ff88}.error{color:#ff4444}</style>
</head><body>
<h2>TOVODOU Aparthôtel</h2>
<div class="card">
<p id="infoChambre">Chargement...</p>
<p>Prix: <span id="prix">...</span></p>
<input id="nom" placeholder="Ton nom complet">
<input id="tel" placeholder="Ton numéro WhatsApp">
<input id="code" placeholder="Code promo ex: TIK1" onkeyup="verifierCode()">
<p id="msgCode"></p>
<button onclick="payer()">PAYER MAINTENANT</button>
<p style="font-size:12px;margin-top:15px;color:#aaa">Paiement Flooz / TMoney sécurisé</p>
</div>
<script>
const TIKTOKEURS={"TIK1":{nom:"TikTokeur 1",tel:"22896466871"}};
const MON_FLOOZ="22897396479"; const MON_TIMONI="22870348262";
let prixBase=70000; let prixFinal=70000; let tiktokeurActif=null; let nbChambres=1;
window.onload=function(){
  const p=new URLSearchParams(window.location.search);
  nbChambres=parseInt(p.get('ch'))||1;
  let prixUrl=parseInt(p.get('prix')); if(prixUrl) prixBase=prixUrl;
  let telUrl=p.get('tel')||""; if(telUrl) document.getElementById('tel').value=telUrl;
  let codeUrl=(p.get('code')||"").toUpperCase();
  prixFinal=prixBase;
  document.getElementById('infoChambre').innerText=nbChambres+" Chambre(s) à Adagbalo";
  document.getElementById('prix').innerText=prixFinal+"F";
  if(codeUrl){document.getElementById('code').value=codeUrl; verifierCode();}
}
function verifierCode(){
  let code=document.getElementById('code').value.toUpperCase().trim();
  if(TIKTOKEURS[code]){
    tiktokeurActif=TIKTOKEURS[code]; prixFinal=Math.round(prixBase*0.95);
    document.getElementById('prix').innerText=prixFinal+"F";
    document.getElementById('msgCode').innerHTML=`<span class='valid'>✅ Code ${code} validé! -5% grâce à ${tiktokeurActif.nom}</span>`;
  }else if(code===""){ document.getElementById('msgCode').innerText=""; prixFinal=prixBase; document.getElementById('prix').innerText=prixFinal+"F"; tiktokeurActif=null;
  }else{ document.getElementById('msgCode').innerHTML="<span class='error'>❌ Code invalide</span>";}
}
function payer(){
  let nom=document.getElementById('nom').value; let telClient=document.getElementById('tel').value; let code=document.getElementById('code').value.toUpperCase()||"Aucun";
  if(!nom||!telClient){alert("Remplis ton nom et numéro");return;}
  let remise=prixBase-prixFinal;
  let msg=`✅ PAIEMENT TOVODOU\nNom: ${nom}\nTel: ${telClient}\n${nbChambres} Chambre(s) = ${prixFinal}F (Prix fixé: ${prixBase}F)\nRemise: ${remise}F\nCode: ${code} ${tiktokeurActif?'('+tiktokeurActif.nom+')':''}\n\nConfirmer Flooz 97 39 64 79 / Timoni 70 34 82 62`;
  window.open("https://wa.me/"+MON_FLOOZ+"?text="+encodeURIComponent(msg),'_blank');
  if(tiktokeurActif){ setTimeout(()=>{ let m=`🎉 Ton code ${code} utilisé!\nClient: ${nom}\nPayé: ${prixFinal}F (Remise ${remise}F)\nMerci!`; window.open("https://wa.me/"+tiktokeurActif.tel+"?text="+encodeURIComponent(m),'_blank'); },1500); }
}
</script></body></html>
