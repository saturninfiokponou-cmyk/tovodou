<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN SAINT-MICHEL</title>
<style>body{font-family:Arial;background:#0f172a;display:flex;justify-content:center;padding:20px}.box{background:white;padding:25px;border-radius:15px;width:100%;max-width:400px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}button{width:100%;padding:15px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold}</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">HOTEL SAINT-MICHEL</h2>
<input id="ch" type="number" value="1">
<input id="prix" type="number" value="25000">
<input id="tel" type="number" placeholder="Num client ex: 90xxxxxx">
<button onclick="gen()">GENERER LIEN SAINT-MICHEL</button>
<div id="res" style="margin-top:15px;word-break:break-all"></div>
</div>
<script>
function gen(){
let c=document.getElementById('ch').value;
let p=document.getElementById('prix').value;
let t=document.getElementById('tel').value;
// LIEN PROPRE SANS tel dedans
let lien="https://tovodou.onrender.com/payer.html?chambres="+c+"&prix="+p;
let msg="Bonjour, voici votre lien de paiement SAINT-MICHEL: "+lien+" Montant: "+p+" FCFA. Payez sur Flooz 97 39 64 79 et envoyez la preuve ici. Merci!";
let wa="https://wa.me/228"+t+"?text="+encodeURIComponent(msg);
document.getElementById('res').innerHTML="Lien propre:<br>"+lien+"<br><br><a href='"+wa+"' target='_blank'><button>ENVOYER SUR WHATSAPP</button></a>";
}
</script>
</body>
</html>
