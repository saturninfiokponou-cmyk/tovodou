<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAINT-MICHEL - Paiement</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;padding:15px}
.card{background:white;padding:25px;border-radius:20px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
.price{font-size:38px;font-weight:900;color:#1e40af}
.btn{display:block;background:#2563eb;color:white;padding:18px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:20px}
.btn2{display:block;background:#ffcc00;color:black;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>SAINT-MICHEL</h1>
<p>Hôtel à Lomé</p>
<hr>
<h3>Détails de la réservation</h3>
<p><span id="chb">1</span> chambre(s)</p>
<div class="price"><span id="pr">0</span> F</div>
<p>Montant total à payer</p>
<hr>
<p style="font-size:14px">Faites le dépôt Flooz / TMoney au :</p>
<h2 style="color:#dc2626">97 39 64 79</h2>
<a class="btn" id="call" href="tel:97396479">APPELER POUR PAYER</a>
<a class="btn2" href="https://wa.me/22897396479">ENVOYER PREUVE SUR WHATSAPP</a>
<p style="font-size:11px;margin-top:15px;color:gray">Votre chambre est bloquée après réception du paiement</p>
</div>
<script>
// Cette partie lit le lien que tu as généré
const params = new URLSearchParams(window.location.search);
const ch = params.get('chambres') || '1';
const prix = params.get('prix') || '70000';
document.getElementById('chb').innerText = ch;
document.getElementById('pr').innerText = prix;
document.getElementById('call').href = "tel:97396479";
</script>
</body>
</html>
