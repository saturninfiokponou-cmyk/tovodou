<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement - SAINT-MICHEL</title>
<style>
body{font-family:Arial;background:#f8fafc;display:flex;justify-content:center;padding:20px}
.card{background:white;padding:25px;border-radius:15px;max-width:400px;width:100%;box-shadow:0 4px 15px rgba(0,0,0,0.1);text-align:center}
.price{font-size:36px;font-weight:bold;color:#1e40af;margin:10px 0}
.btn{background:#ffcc00;color:black;padding:16px;display:block;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:20px;font-size:16px}
</style>
</head>
<body>
<div class="card">
<h1 style="margin-bottom:0">SAINT-MICHEL</h1>
<p style="margin-top:5px;color:#64748b">Hôtel - Lomé</p>
<hr>
<p>Réservation de <b id="chb">-</b> chambre(s)</p>
<p class="price"><span id="pr">0</span> FCFA</p>
<p>Paiement sécurisé par Flooz</p>
<a class="btn" id="paybtn" href="#">PAYER AVEC FLOOZ<br>97 39 64 79</a>
<p style="font-size:12px;margin-top:15px;color:#64748b">Après paiement, envoyez la capture sur WhatsApp</p>
</div>
<script>
let url=new URLSearchParams(window.location.search);
document.getElementById('chb').innerText=url.get('chambres')||1;
document.getElementById('pr').innerText=url.get('prix')||0;
</script>
</body>
</html>
