<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN SAINT-MICHEL</title>
<style>body{font-family:Arial;background:#0f172a;display:flex;justify-content:center;padding:20px} .box{background:white;padding:25px;border-radius:15px;width:100%;max-width:400px} input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px} button{width:100%;padding:15px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold}</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">SAINT-MICHEL</h2>
<input id="ch" type="number" value="1" placeholder="Nombre chambres">
<input id="prix" type="number" value="70000" placeholder="Prix total">
<input id="tel" type="number" placeholder="Numéro client 90xxxxxx">
<button onclick="generer()">GENERER</button>
<div id="r" style="margin-top:15px;word-break:break-all"></div>
</div>
<script>
function generer(){
 let c=document.getElementById('ch').value;
 let p=document.getElementById('prix').value;
 let t=document.getElementById('tel').value;
 let lien="https://tovodou.onrender.com/payer.html?chambres="+c+"&prix="+p;
 let msg="Bonjour, ici Hotel SAINT-MICHEL. Voici votre lien de paiement: "+lien+" Montant: "+p+" FCFA. Merci de payer sur 97 39 64 79 puis envoyer la preuve ici.";
 let wa="https://wa.me/228"+t+"?text="+encodeURIComponent(msg);
 document.getElementById('r').innerHTML="<b>Lien:</b><br>"+lien+"<br><br><a href='"+wa+"' target='_blank'><button>ENVOYER SUR WHATSAPP</button></a>";
}
</script>
</body>
</html>
