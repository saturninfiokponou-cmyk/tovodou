<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ADMIN TOVODOU</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px}.card{background:#222;padding:20px;border-radius:12px;max-width:400px;margin:auto;border:2px solid #ff8c00} input{width:95%;padding:12px;margin:8px 0;border-radius:8px;border:none} button{background:#00ff88;color:#000;padding:15px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin-top:10px} #lien{word-break:break-all;background:#000;padding:15px;border-radius:8px;margin-top:15px;border:1px dashed #ff8c00;display:none}</style>
</head><body>
<h2 style="text-align:center">ADMIN TOVODOU - Générateur de lien</h2>
<div class="card">
<input id="ch" type="number" placeholder="Nombre de chambres ex: 2" value="1">
<input id="prix" type="number" placeholder="Prix que TU fixes ex: 70000">
<input id="tel" placeholder="Numéro client ex: 90 12 34 56">
<button onclick="generer()">GÉNÉRER LE LIEN DE PAIEMENT</button>
<div id="lien"></div>
<button id="btnW" style="display:none;background:#25D366" onclick="envoyerWA()">ENVOYER SUR WHATSAPP</button>
</div>
<script>
let lienFinal = "";
function generer(){
  let ch = document.getElementById('ch').value || 1;
  let prix = document.getElementById('prix').value;
  let tel = document.getElementById('tel').value;
  if(!prix){ alert("Mets le prix que tu veux qu'il paye!"); return; }
  lienFinal = `https://tovodou.onrender.com/payer.html?ch=${ch}&prix=${prix}&tel=${tel.replace(/\s/g,'')}`;
  document.getElementById('lien').style.display='block';
  document.getElementById('lien').innerHTML = `<b>Lien à envoyer au client:</b><br><br>${lienFinal}`;
  document.getElementById('btnW').style.display='block';
}
function envoyerWA(){
  let tel = document.getElementById('tel').value.replace(/\s/g,'');
  let msg = `Bonjour, voici votre lien de paiement TOVODOU: ${lienFinal}. Remplissez votre nom et code promo TIK1 si vous avez (-5%) puis payez. Merci!`;
  window.open(`https://wa.me/228${tel.substring(tel.length-8)}?text=`+encodeURIComponent(msg), '_blank');
}
</script></body></html>
